# 江枫的实验室 —— 静态站点 nginx 配置
# 安装位置：/etc/nginx/sites-available/blog  →  软链到 sites-enabled/blog
# 由 deploy/deploy-blog.sh 自动安装，请勿手改服务器上的副本
#
# 站点是 Astro 纯静态输出（build.format: 'directory'），文件同步到 /var/www/blog

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 局域网直接用 IP 访问；server_name 写 IP 是为了让重定向/日志更清楚
    server_name 192.168.31.149 _;

    root /var/www/blog;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Astro 目录式输出：/about/ 实际是 /about/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 构建产物带内容 hash（_astro/xxx.abc123.css），可以永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Debian 自带的 /etc/nginx/mime.types 里【没有 opus】（只有 ogg/oga/spx），
    # 不补这一条的话 .opus 会以 application/octet-stream 发出去，浏览器可能拒绝直接播放。
    # default_type 只在扩展名查不到时生效，所以放这里不会影响其它类型。
    location ~* \.opus$ {
        default_type audio/ogg;
        expires 7d;
        add_header Cache-Control "public";
    }

    # LRC 歌词是纯文本，浏览器 fetch 后当文本读；不补会以 octet-stream 发出去
    location ~* \.lrc$ {
        default_type text/plain;
        charset utf-8;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 音频、封面、歌词：文件名不带 hash，改了要能马上生效，只缓存 7 天
    location ~* \.(?:opus|mp3|m4a|webp|jpe?g|png|gif|svg|ico|lrc|json|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML 不做缓存，避免部署完还看到旧页面
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml application/manifest+json;

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
